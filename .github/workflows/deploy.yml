name: Deploy AnuraOS to Vercel
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Java (Required by AnuraOS)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-v105

      - name: Install Missing WebAssembly Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          export CARGO_BUILD_JOBS=$(nproc)
          
          # Add cargo bin to the current step's execution path immediately
          export PATH="$HOME/.cargo/bin:$PATH"
          
          # Use local cache for wasm-bindgen if available
          if ! command -v wasm-bindgen &> /dev/null || [ "$(wasm-bindgen --version 2>&1 | awk '{print $2}')" != "0.2.105" ]; then
            echo "Installing matching wasm-bindgen-cli v0.2.105..."
            cargo install wasm-bindgen-cli --version 0.2.105 --root ~/.cargo --force
          fi
          
          # Manually clone and compile the custom wasm-snip tool
          if ! command -v wasm-snip &> /dev/null; then
            echo "Manually cloning specialized MercuryWorkshop wasm-snip fork..."
            git clone https://github.com /tmp/wasm-snip
            cd /tmp/wasm-snip
            cargo install --path . --root ~/.cargo
            cd $GITHUB_WORKSPACE
          fi
          
          # Export to system path for subsequent steps
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Assets
        run: |
          pnpm install
          make all

      - name: Pull Vercel Environment Information
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }} --project=anura-os-server

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
