name: Deploy AnuraOS to Vercel
on:
  workflow_dispatch:

env:
  WASM_BINDGEN_VERSION: "0.2.105"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: sudo apt update && sudo apt install -y git build-essential clang default-jre gcc-multilib

      - name: Setup Rewriter Toolchain
        uses: ./external/anura-browserjs/packages/scramjet/.github/actions/setup-rewriter-toolchain
        with:
          wasm-bindgen-version: ${{ env.WASM_BINDGEN_VERSION }}
          rewriter-path: external/anura-browserjs/packages/scramjet/packages/core/rewriter
          github-token: ${{ github.token }}

      - name: Pack Anura
        run: make static

      - name: Pull Vercel Environment Information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy ./static --prod --token=${{ secrets.VERCEL_TOKEN }}
