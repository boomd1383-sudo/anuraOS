
name: Deploy AnuraOS to Vercel

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            make \
            jq \
            uuid-runtime \
            wget \
            clang \
            gcc-multilib \
            binaryen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install PNPM
        run: npm install -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-anura-v105

      - name: Install WebAssembly Tools
        run: |
          export CARGO_BUILD_JOBS=$(nproc)

          cargo install wasm-bindgen-cli \
            --version 0.2.105 \
            --root ~/.cargo \
            --force

          cargo install --git \
            https://github.com/r58Playz/wasm-snip \
            --root ~/.cargo \
            --force

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build AnuraOS
        run: |
          pnpm install
          make all

      - name: Configure Vercel
        run: |
          mkdir -p .vercel
          echo '{
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
          }' > .vercel/project.json

      - name: Pull Vercel Settings
        run: |
          npx vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: |
          npx vercel build --prod \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: |
          npx vercel deploy --prebuilt --prod \
            --token=${{ secrets.VERCEL_TOKEN }}
